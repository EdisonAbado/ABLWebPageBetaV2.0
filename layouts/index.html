{{ define "main" }}
<style>
    .header, .footer { display: none !important; }
    
    .main {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    .hero-container {
        width: 100vw;
        height: 100vh;
        /* La primera imagen carga por defecto mediante CSS */
        background-image: url('/img/portada-01.jpg'); 
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
        /* Transición suave al cambiar el fondo */
        transition: background-image 1.5s ease-in-out;
    }

    .hero-container::before {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4); 
        z-index: 1;
    }

    .hero-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
    }

    .hero-title {
        font-size: 3.5rem;
        font-weight: 300;
        letter-spacing: 6px;
        text-transform: uppercase;
        margin: 0;
    }

    .hero-subtitle {
        font-size: 1.2rem;
        font-weight: 300;
        max-width: 600px;
        margin: 0;
        opacity: 0.85;
        letter-spacing: 1px;
    }

    .hero-links {
        display: flex;
        gap: 2rem;
        margin-top: 2rem;
    }

    .hero-links a {
        color: #ffffff;
        text-decoration: none;
        font-size: 1.1rem;
        letter-spacing: 1.5px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        padding: 12px 28px;
        transition: all 0.3s ease;
        text-transform: uppercase;
    }

    .hero-links a:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: #ffffff;
    }

    .hero-footer {
        position: absolute;
        bottom: 25px;
        z-index: 2;
        font-size: 0.8rem;
        opacity: 0.6;
        font-weight: 300;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    @media (max-width: 768px) {
        .hero-title { font-size: 2.5rem; letter-spacing: 4px; }
        .hero-subtitle { font-size: 1rem; }
        .hero-links { 
            flex-direction: column; 
            gap: 1rem; 
            width: 100%; 
            max-width: 250px;
        }
        .hero-links a { width: 100%; box-sizing: border-box; }
        .hero-footer { font-size: 0.7rem; text-align: center; }
    }
</style>

<div class="hero-container" id="hero">
    <div class="hero-content">
        <h1 class="hero-title">Abado Lab</h1>
        <p class="hero-subtitle">Desarrollo tecnológico y exploraciones visuales</p> 
        
        <div class="hero-links">
            <a href="/ingenieria/">Ingeniería y Sistemas Dinámicos</a>
            <a href="/fotografia/">Fotografía Documental</a>
        </div>
    </div>
    
    <div class="hero-footer">
        Cusco, Perú 2026 &copy; Todos los derechos reservados
    </div>
</div>

<script>
    // 1. Configuración de imágenes (Añade o quita las que necesites)
    const imagenesPortada = [
        '/img/portada-01.jpg',
        '/img/portada-02.jpg',
        '/img/portada-03.jpg'
    ];
    
    // 2. Configura el tiempo de refresco en milisegundos (5000 = 5 segundos)
    const tiempoRefresco = 5000;

    // Precarga silenciosa para evitar parpadeos en redes lentas
    imagenesPortada.forEach(src => {
        const img = new Image();
        img.src = src;
    });

    let indiceActual = 0;
    const heroElement = document.getElementById('hero');

    // Bucle infinito que cambia la imagen
    setInterval(() => {
        indiceActual = (indiceActual + 1) % imagenesPortada.length;
        heroElement.style.backgroundImage = `url('${imagenesPortada[indiceActual]}')`;
    }, tiempoRefresco);
</script>
{{ end }}
