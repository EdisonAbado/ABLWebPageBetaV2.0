{{ define "main" }}
<style>
    /* Ocultar elementos por defecto de PaperMod */
    .header, .footer { display: none !important; }
    
    .main {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    /* Contenedor principal a pantalla completa */
    .hero-container {
        width: 100vw;
        height: 100vh;
        /* Cambia el nombre de la imagen por el tuyo */
        background-image: url('/img/portada-01.png'); 
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
    }

    /* Capa oscura sutil (opcional) para garantizar la lectura del texto */
    .hero-container::before {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.3); /* Ajusta el 0.3 si quieres oscurecer más o menos la foto */
        z-index: 1;
    }

    /* Contenido central */
    .hero-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
    }

    .hero-title {
        font-size: 3.5rem;
        font-weight: 300;
        letter-spacing: 6px;
        text-transform: uppercase;
        margin: 0;
    }

    .hero-subtitle {
        font-size: 1.2rem;
        font-weight: 300;
        max-width: 600px;
        margin: 0;
        opacity: 0.85;
        letter-spacing: 1px;
    }

    /* Botones / Enlaces */
    .hero-links {
        display: flex;
        gap: 2rem;
        margin-top: 2rem;
    }

    .hero-links a {
        color: #ffffff;
        text-decoration: none;
        font-size: 1.1rem;
        letter-spacing: 1.5px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        padding: 12px 28px;
        transition: all 0.3s ease;
        text-transform: uppercase;
    }

    .hero-links a:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: #ffffff;
    }

    /* Pie de página absoluto */
    .hero-footer {
        position: absolute;
        bottom: 25px;
        z-index: 2;
        font-size: 0.8rem;
        opacity: 0.6;
        font-weight: 300;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    /* Adaptación para celulares */
    @media (max-width: 768px) {
        .hero-title { font-size: 2.5rem; letter-spacing: 4px; }
        .hero-subtitle { font-size: 1rem; }
        .hero-links { 
            flex-direction: column; 
            gap: 1rem; 
            width: 100%; 
            max-width: 250px;
        }
        .hero-links a { width: 100%; box-sizing: border-box; }
        .hero-footer { font-size: 0.7rem; text-align: center; }
    }
</style>

<div class="hero-container">
    <div class="hero-content">
        <h1 class="hero-title">Abado Lab</h1>
        <!-- Edita tu texto corto aquí -->
        <p class="hero-subtitle">Desarrollo tecnológico y exploraciones visuales</p> 
        
        <div class="hero-links">
            <a href="/ingenieria/">Ingeniería y Sistemas Dinámicos</a>
            <a href="/fotografia/">Fotografía Documental</a>
        </div>
    </div>
    
    <div class="hero-footer">
        Cusco, Perú 2026 &copy; Todos los derechos reservados
    </div>
</div>
{{ end }}
